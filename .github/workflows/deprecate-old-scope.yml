name: Deprecate old scope

on:
  workflow_dispatch:

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Deprecate @hardimpactdev/launch-ui
        run: npm deprecate @hardimpactdev/launch-ui "Package moved to @nckrtl/launch-ui"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
